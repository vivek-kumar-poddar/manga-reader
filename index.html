<!doctype html><html lang="en"><head>
<script>
  // Resolve relative build assets from the app mount, including deep links.
  const appBase = document.createElement('base');
  appBase.href = location.protocol === 'file:'
    ? './'
    : location.pathname === '/manga-reader' || location.pathname.startsWith('/manga-reader/')
      ? '/manga-reader/' : '/';
  document.head.appendChild(appBase);
</script><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#fafafa"/><meta name="description" content="A private, offline manga reader for your local folders."/><title>Manga Reader</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
