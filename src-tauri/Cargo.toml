[package]
name = "manga-reader"
version = "2.0.0"
description = "High-performance Manga Reader"
authors = ["you"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "manga_reader_lib"
crate-type = ["staticlib", "rlib"]


[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
walkdir = "2.5"
rayon = "1.10"
dunce = "1.0"
imagesize = "0.13"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

