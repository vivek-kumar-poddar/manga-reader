name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust Checks & Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo Format Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Cargo Clippy (--locked -D warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: Cargo Test (--locked)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  frontend:
    name: Frontend Validation & Dual Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Check Formatting
        run: npm run format:check
      - name: TypeScript Typecheck (Web & Desktop)
        run: npm run typecheck
      - name: Playwright Validation & Acceptance Tests (Migration, Recovery, Import & Reader)
        run: npm run test:validation
      - name: Production Web Build
        run: npm run build
      - name: Production Desktop Build
        run: npm run build:desktop

